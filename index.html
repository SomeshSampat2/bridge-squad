<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1838">
<title>Bridge Squad — Three.js</title>
<style>
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#05080f;position:fixed;inset:0;width:100%;
    font-family:"Arial Black","Segoe UI Black",Impact,"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#0a1838;font-size:12px}
  #c{display:block;width:100%;height:100%}
  /* ---------- top-right buttons */
  #ui{position:absolute;right:2.2%;top:1.4%;display:flex;gap:.35em;z-index:5}
  .ib{width:2.5em;height:2.5em;border-radius:.95em;border:.14em solid rgba(255,255,255,.92);
    background:linear-gradient(180deg,rgba(96,170,255,.82),rgba(24,66,180,.86));
    box-shadow:0 .2em 0 rgba(8,30,100,.95),0 .5em .8em rgba(0,0,0,.35),inset 0 .14em 0 rgba(255,255,255,.55);
    color:#fff;font:inherit;font-size:1em;font-weight:900;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;transition:transform .08s}
  .ib:active{transform:translateY(.16em);box-shadow:0 .05em 0 rgba(8,30,100,.95),inset 0 .14em 0 rgba(255,255,255,.55)}
  #bQual{width:auto;min-width:2.5em;padding:0 .6em;font-size:.8em}
  /* ---------- HUD */
  #hud{position:absolute;left:2.5%;top:1.4%;width:48%;max-width:34em;z-index:5;pointer-events:none;
    display:flex;flex-direction:column;align-items:stretch;gap:.32em}
  #hudR{display:flex;align-items:center;gap:.55em}
  #hudL{font-size:.86em;color:#fff;white-space:nowrap;padding:.32em .7em;border-radius:.8em;
    background:linear-gradient(180deg,rgba(96,170,255,.85),rgba(24,66,180,.9));border:.14em solid #fff;
    box-shadow:0 .18em 0 rgba(8,30,100,.95),inset 0 .12em 0 rgba(255,255,255,.5);text-shadow:0 .1em 0 rgba(0,20,80,.7);letter-spacing:.04em}
  #bar{flex:1;height:1.05em;border-radius:.6em;background:linear-gradient(180deg,rgba(4,12,40,.85),rgba(14,30,80,.8));
    border:.14em solid #fff;box-shadow:0 .18em 0 rgba(8,30,100,.9),0 .4em .6em rgba(0,0,0,.3);position:relative}
  #barF{height:100%;width:0;border-radius:.45em;background:linear-gradient(180deg,#b8f0ff,#3d98ff 55%,#1a56e0);
    box-shadow:inset 0 .16em 0 rgba(255,255,255,.65)}
  #barI{position:absolute;right:-.75em;top:50%;width:2em;height:2em;transform:translateY(-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff9a7a,#d0181f 60%,#8a0b14);border:.14em solid #fff;
    box-shadow:0 .16em 0 rgba(90,0,10,.9);display:flex;align-items:center;justify-content:center;font-size:.8em}
  #hudD{align-self:flex-start;font-size:.72em;color:#ffe6a8;letter-spacing:.06em;padding:.18em .55em;border-radius:.6em;
    background:rgba(4,14,44,.62);border:.1em solid rgba(255,255,255,.55);text-shadow:0 .1em 0 rgba(0,20,80,.8)}
  #hudD b{color:#fff}
  #pw{display:flex;gap:.35em;flex-wrap:wrap}
  .pwc{display:flex;align-items:center;gap:.3em;font-size:.68em;padding:.16em .5em;border-radius:.6em;color:#fff;
    background:rgba(6,16,48,.72);border:.1em solid currentColor;text-shadow:0 .1em 0 rgba(0,0,0,.55);letter-spacing:.04em}
  .pwc i{font-style:normal;font-weight:900;font-size:1.05em}
  .pwc s{text-decoration:none;opacity:.85;font-size:.92em}
  #hint{position:absolute;left:0;right:0;bottom:1.2%;text-align:center;color:rgba(255,255,255,.72);font-size:.78em;
    letter-spacing:.04em;z-index:5;pointer-events:none;text-shadow:0 .1em .2em #000}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .45s}
  /* ---------- camera toast */
  #toast{position:absolute;left:50%;bottom:9%;transform:translate(-50%,.6em);z-index:6;pointer-events:none;
    padding:.5em 1em;border-radius:.7em;background:rgba(4,14,44,.8);border:.12em solid rgba(255,255,255,.75);
    color:#fff;font-size:.82em;letter-spacing:.1em;opacity:0;transition:opacity .18s,transform .18s;
    text-shadow:0 .1em 0 rgba(0,20,80,.8);box-shadow:0 .2em .5em rgba(0,0,0,.35)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  /* ---------- overlay */
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    z-index:6;cursor:pointer;background:radial-gradient(ellipse at center,rgba(6,14,40,.2),rgba(4,10,32,.78))}
  #ov.show{display:flex}
  #ovt{font-size:5.4em;line-height:.95;letter-spacing:.02em;background:linear-gradient(180deg,#ffffff 18%,#cfeaff 52%,#69b4ff 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.09em #0b2a7a;paint-order:stroke fill;
    filter:drop-shadow(0 .07em 0 #0b2a7a) drop-shadow(0 .18em .22em rgba(0,0,0,.55));animation:drop .5s cubic-bezier(.2,1.5,.4,1) both}
  #ovt.win,#ovt.lose{font-size:4.5em}
  #ovt.win{background-image:linear-gradient(180deg,#fffbe0 15%,#ffe14a 50%,#ff9d0a 92%);-webkit-text-stroke-color:#8a3d00;
    filter:drop-shadow(0 .07em 0 #8a3d00) drop-shadow(0 .18em .22em rgba(0,0,0,.55)) drop-shadow(0 0 .5em rgba(255,200,60,.55))}
  #ovt.lose{background-image:linear-gradient(180deg,#ffd0c4 15%,#ff5142 50%,#c4121c 92%);-webkit-text-stroke-color:#4a0508;
    filter:drop-shadow(0 .07em 0 #4a0508) drop-shadow(0 .18em .22em rgba(0,0,0,.55))}
  #stars{display:none;font-size:3.4em;line-height:1;margin-bottom:.1em;letter-spacing:.12em}
  #stars.show{display:block}
  #stars span{display:inline-block;color:#3a4468;-webkit-text-stroke:.05em #fff;paint-order:stroke fill;filter:drop-shadow(0 .08em 0 rgba(0,0,0,.4))}
  #stars span.on{color:#ffd21f;-webkit-text-stroke-color:#8a3d00;filter:drop-shadow(0 .08em 0 #8a3d00) drop-shadow(0 0 .3em rgba(255,210,60,.8));animation:drop .45s cubic-bezier(.2,1.7,.4,1) both}
  #stars span:nth-child(2){animation-delay:.12s;transform:translateY(-.12em)}
  #stars span:nth-child(3){animation-delay:.24s}
  #ovs{margin-top:1em;font-size:1.2em;color:#fff;text-shadow:0 .12em .2em #000;max-width:86%;line-height:1.4}
  .chips{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin-top:.2em}
  .chip{padding:.4em .8em;border-radius:.9em;background:linear-gradient(180deg,rgba(40,70,150,.85),rgba(12,26,76,.9));
    border:.12em solid rgba(255,255,255,.85);box-shadow:0 .16em 0 rgba(0,0,0,.35),inset 0 .1em 0 rgba(255,255,255,.3);
    font-size:.86em;text-shadow:none}
  .chip b{display:block;font-size:1.5em;color:#ffe14a;text-shadow:0 .08em 0 rgba(0,0,0,.45)}
  #ovb{margin-top:1.4em;font:inherit;font-size:1.9em;color:#fff;background:linear-gradient(180deg,#7fd4ff,#2b8cff 48%,#155be8);
    border:.14em solid #fff;border-radius:.62em;padding:.45em 1.15em;cursor:pointer;
    box-shadow:0 .22em 0 #0b3ea8,0 .5em .7em rgba(0,0,0,.45),inset 0 .14em 0 rgba(255,255,255,.6);
    text-shadow:0 .08em 0 rgba(0,30,110,.8);animation:pulse 1s ease-in-out infinite}
  #ovh{margin-top:1.6em;font-size:.9em;color:rgba(255,255,255,.85);text-shadow:0 .1em .2em #000;line-height:1.6}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @keyframes drop{0%{transform:scale(.2) translateY(-.6em);opacity:0}100%{transform:none;opacity:1}}
  body.clean #ui,body.clean #hud,body.clean #hint,body.clean #ovb,body.clean #ovh{display:none}
  #unhide{position:absolute;right:0;top:0;width:14%;height:8%;z-index:7;display:none}
  body.clean #unhide{display:block}
  /* ---------- loader */
  #load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 40%,#1b3a86,#0a1838 70%);color:#fff;text-align:center;transition:opacity .45s}
  #load.done{opacity:0;pointer-events:none}
  #load h1{margin:0;font-size:min(13vw,64px);line-height:.95;letter-spacing:.03em;text-shadow:0 .06em 0 #0b3ea8,0 .14em .3em rgba(0,0,0,.5);animation:ldp 1.6s ease-in-out infinite}
  #lbar{width:min(62vw,300px);height:16px;border-radius:10px;border:3px solid #fff;background:rgba(4,12,40,.7);overflow:hidden;box-shadow:0 4px 0 rgba(8,30,100,.9)}
  #lfill{height:100%;width:4%;background:linear-gradient(180deg,#b8f0ff,#3d98ff 55%,#1a56e0);transition:width .25s}
  #ltxt{font-size:14px;opacity:.85;letter-spacing:.08em}
  @keyframes ldp{50%{transform:scale(1.04)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="ui">
    <button class="ib" id="bMute" title="Mute (M)">&#9835;</button>
    <button class="ib" id="bRestart" title="Restart (R)">&#8635;</button>
    <button class="ib" id="bCam" title="Camera (C)">&#9673;</button>
    <button class="ib" id="bHide" title="Hide UI (H)">&#128065;</button>
    <button class="ib" id="bQual" title="Quality (Q)">HIGH</button>
  </div>

  <div id="hud">
    <div id="hudR">
      <div id="hudL">STAGE 1</div>
      <div id="bar"><div id="barF"></div><div id="barI">&#128128;</div></div>
    </div>
    <div id="hudD">SQUAD DMG <b>0</b>/s</div>
    <div id="pw"></div>
  </div>

  <div id="hint">DRAG / A·D TO STEER · READ BOTH WALLS · C CAMERA · H HIDE · R RESTART · M MUTE · Q QUALITY</div>
  <div id="flash"></div>
  <div id="toast"></div>
  <div id="unhide"></div>

  <div id="ov">
    <div id="stars"></div>
    <div id="ovt">BRIDGE<br>SQUAD</div>
    <div id="ovs"></div>
    <button id="ovb">TAP TO START</button>
    <div id="ovh"></div>
  </div>
</div>

<div id="load">
  <h1>BRIDGE<br>SQUAD</h1>
  <div id="lbar"><div id="lfill"></div></div>
  <div id="ltxt">LOADING…</div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
